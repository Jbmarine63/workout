<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Six Pack Workout</title>
<meta name="description" content="Offline workout log with the 16 Weeks to Six Pack Abs program.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="application-name" content="Workout">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#111418" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar"><h1 id="title">Workout</h1><span id="offlineBadge" hidden>Offline</span></header>
  <div id="banner"></div>
  <main id="view" tabindex="-1"><p class="muted pad">Loading…</p></main>
  <div id="timerbar" hidden></div>
  <nav id="tabs">
    <a href="#/program" data-tab="program"><span class="ico">📅</span><span>Program</span></a>
    <a href="#/exercises" data-tab="exercises"><span class="ico">🏋️</span><span>Exercises</span></a>
    <a href="#/session" data-tab="session"><span class="ico">⏱️</span><span>Workout</span></a>
    <a href="#/history" data-tab="history"><span class="ico">📓</span><span>History</span></a>
    <a href="#/more" data-tab="more"><span class="ico">⚙️</span><span>More</span></a>
  </nav>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<noscript>This app needs JavaScript.</noscript>
<script src="js/app.js"></script>
</body>
</html>
